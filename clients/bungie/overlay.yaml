  - target: '$.components.schemas["Destiny.Entities.Items.DestinyItemComponent"].properties["itemInstanceId"]["format"]'
    remove: true
  - target: '$.components.schemas["Destiny.Components.Profiles.DestinyProfileTransitoryPartyMember"].properties["membershipId"]'
    update:
      type: string
  - target: '$.components.schemas["Destiny.Components.Profiles.DestinyProfileTransitoryPartyMember"].properties["membershipId"]["format"]'
    remove: true
  - target: '$.components.schemas["Destiny.Entities.Characters.DestinyCharacterComponent"].properties["membershipId"]'
    update:
      type: string
