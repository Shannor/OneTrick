  - target: '$.components.schemas["Destiny.HistoricalStats.DestinyHistoricalStatsPeriodGroup"]'
    update:
      x-go-name: "StatsPeriodGroup"
  - target: '$.components.schemas["Destiny.HistoricalStats.DestinyPostGameCarnageReportTeamEntry"].properties["teamId"]'
    update:
      x-go-name: teamID
  - target: '$.components.responses["User.UserSearchResponse"]'
    update:
      x-go-name: "UserSearchResponse"
  - target: '$.components.responses["Destiny.Responses.DestinyProfileResponse"]'
    update:
      x-go-name: "DestinyProfileResponse"
  - target: '$.components.responses["Config.ClanBanner.ClanBannerSource"]'
    update:
      x-go-name: "Dont care"
  - target: '$.components.responses["Destiny.Responses.DestinyItemResponse"]'
    update:
      x-go-name: "DestinyItemResponse"
  - target: '$.components.responses["Destiny.HistoricalStats.DestinyActivityHistoryResults"]'
    update:
      x-go-name: "DestinyActivityHistoryResults"

  # 5. Inline Activity Mode Enum Names (x-enum-varnames)
