    remove: true
  - target: '$.components.schemas["Destiny.Components.Loadouts.DestinyLoadoutItemComponent"].properties["itemInstanceId"]'
    update:
      type: string
  - target: '$.components.schemas["Destiny.Components.Loadouts.DestinyLoadoutItemComponent"].properties["itemInstanceId"]["format"]'
    remove: true
  - target: '$.components.schemas["Destiny.Quests.DestinyQuestStatus"].properties["itemInstanceId"]'
    update:
      type: string
  - target: '$.components.schemas["Destiny.Quests.DestinyQuestStatus"].properties["itemInstanceId"]["format"]'
    remove: true

  # 3. RGBA Byte-to-Integer Coercions (DestinyColor channels are 0..255 JSON numbers, not base64 bytes)
  - target: '$.components.schemas["Destiny.Misc.DestinyColor"].properties["red"]'
    update:
      type: integer
  - target: '$.components.schemas["Destiny.Misc.DestinyColor"].properties["red"]["format"]'
    remove: true
  - target: '$.components.schemas["Destiny.Misc.DestinyColor"].properties["green"]'
    update:
      type: integer
  - target: '$.components.schemas["Destiny.Misc.DestinyColor"].properties["green"]["format"]'
    remove: true
  - target: '$.components.schemas["Destiny.Misc.DestinyColor"].properties["blue"]'
    update:
      type: integer
  - target: '$.components.schemas["Destiny.Misc.DestinyColor"].properties["blue"]["format"]'
    remove: true
  - target: '$.components.schemas["Destiny.Misc.DestinyColor"].properties["alpha"]'
    update:
      type: integer
  - target: '$.components.schemas["Destiny.Misc.DestinyColor"].properties["alpha"]["format"]'
    remove: true

