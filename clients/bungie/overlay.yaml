  - target: '$.components.schemas["Destiny.Entities.Characters.DestinyCharacterComponent"].properties["characterId"]["format"]'
    remove: true
  - target: '$.components.schemas["Destiny.Entities.Characters.DestinyCharacterComponent"].properties["minutesPlayedThisSession"]'
    update:
      type: string
  - target: '$.components.schemas["Destiny.Entities.Characters.DestinyCharacterComponent"].properties["minutesPlayedThisSession"]["format"]'
    remove: true
  - target: '$.components.schemas["Destiny.Entities.Characters.DestinyCharacterComponent"].properties["minutesPlayedTotal"]'
    update:
      type: string
  - target: '$.components.schemas["Destiny.Entities.Characters.DestinyCharacterComponent"].properties["minutesPlayedTotal"]["format"]'
    remove: true
  - target: '$.components.schemas["Destiny.Responses.DestinyItemResponse"].properties["characterId"]'
