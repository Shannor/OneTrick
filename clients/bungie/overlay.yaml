  - target: '$.components.schemas["Destiny.HistoricalStats.DestinyPlayer"]'
    update:
      x-go-type-name: "DestinyPlayer"
  - target: '$.components.schemas["Destiny.HistoricalStats.DestinyPostGameCarnageReportExtendedData"]'
    update:
      x-go-name: "PostGameCarnageReportExtendedData"
  - target: '$.components.schemas["Destiny.HistoricalStats.DestinyHistoricalWeaponStats"]'
    update:
      x-go-name: "HistoricalWeaponStats"
  - target: '$.components.schemas["Destiny.HistoricalStats.DestinyPostGameCarnageReportTeamEntry"]'
