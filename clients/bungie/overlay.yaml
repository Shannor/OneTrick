# yaml-language-server: $schema=https://raw.githubusercontent.com/OAI/Overlay-Specification/main/schemas/v1.0/schema.json
overlay: 1.0.0
info:
  title: OneTrick Bungie OpenAPI Overlay
  version: 1.0.0
actions:
  # 1. Broken Upstream Path Fix
  - target: '$["paths"]["/GroupV2/{groupId}/AdminsAndFounder/"]'
    description: Remove broken upstream path declaring {currentpage} path param without {currentpage} in URL template
    remove: true

  # 2. 64-Bit Integer-to-String Coercions (Bungie serializes int64 values as JSON strings)
  - target: '$.components.schemas["User.UserInfoCard"].properties["membershipId"]'
    update:
      type: string
  - target: '$.components.schemas["User.UserInfoCard"].properties["membershipId"]["format"]'
    remove: true
  - target: '$.components.schemas["User.GeneralUser"].properties["membershipId"]'
    update:
      type: string
  - target: '$.components.schemas["User.GeneralUser"].properties["membershipId"]["format"]'
    remove: true
  - target: '$.components.schemas["User.GeneralUser"].properties["successMessageFlags"]'
    update:
      type: string
  - target: '$.components.schemas["User.GeneralUser"].properties["successMessageFlags"]["format"]'
    remove: true
  - target: '$.components.schemas["User.UserMembershipData"].properties["primaryMembershipId"]'
    update:
      type: string
  - target: '$.components.schemas["User.UserMembershipData"].properties["primaryMembershipId"]["format"]'
    remove: true
  - target: '$.components.schemas["GroupsV2.GroupUserInfoCard"].properties["membershipId"]'
    update:
      type: string
  - target: '$.components.schemas["GroupsV2.GroupUserInfoCard"].properties["membershipId"]["format"]'
    remove: true
  - target: '$.components.schemas["User.UserSearchResponseDetail"].properties["bungieNetMembershipId"]'
    update:
      type: string
