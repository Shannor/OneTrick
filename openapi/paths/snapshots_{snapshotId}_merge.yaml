post:
  operationId: MergeSnapshots
  description: Merge one or more compatible source snapshots into a target snapshot
  parameters:
    - $ref: ../components/parameters/X-User-ID.yaml
    - name: snapshotId
      in: path
      x-go-name: snapshotID
      required: true
      schema:
        type: string
      description: The unique identifier for the target snapshot to merge into.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            sourceSnapshotId:
              type: string
              x-go-name: sourceSnapshotID
              description: Single source snapshot ID to merge into snapshotId (backwards-compatible)
            sourceSnapshotIds:
              type: array
              x-go-name: sourceSnapshotIDs
              description: One or more source snapshot IDs to batch-merge into snapshotId
              items:
                type: string
  responses:
    "200":
      description: Snapshots merged successfully
      content:
        application/json:
          schema:
            type: boolean
    "400":
      description: Invalid or incompatible snapshots for merge
      content:
        application/json:
          schema:
            $ref: ../components/schemas/OneTrickError.yaml
    "401":
      description: Unauthorized user
      content:
        application/json:
          schema:
            $ref: ../components/schemas/OneTrickError.yaml
    "404":
      description: Snapshot not found
      content:
        application/json:
          schema:
            $ref: ../components/schemas/OneTrickError.yaml
    "500":
      description: Error merging snapshots
      content:
        application/json:
          schema:
            $ref: ../components/schemas/OneTrickError.yaml
