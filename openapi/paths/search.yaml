summary: Search for recorded 1 Trick users and Bungie Destiny 2 players
post:
  operationId: search
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - prefix
            - page
          properties:
            prefix:
              type: string
              minLength: 1
            page:
              type: integer
              format: int32
              minimum: 0
  responses:
    '200':
      description: Return a list of search results found
      content:
        application/json:
          schema:
            type: object
            required:
              - results
              - hasMore
            properties:
              results:
                type: array
                items:
                  $ref: ../components/schemas/SearchUserResult.yaml
              hasMore:
                type: boolean
    '400':
      description: Invalid request body
      content:
        application/json:
          schema:
            type: object
            required:
              - message
            properties:
              message:
                type: string
    '500':
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: ../components/schemas/OneTrickError.yaml
