get:
  operationId: GetSessionAggregates
  parameters:
    - name: sessionId
      in: path
      required: true
      schema:
        type: string
        x-go-name: sessionID
  responses:
    '200':
      description: Array of aggregates
      content:
        application/json:
          schema:
            type: object
            required:
              - aggregates
              - snapshots
              - participants
            properties:
              aggregates:
                type: array
                items:
                  $ref: ../components/schemas/Aggregate.yaml
              snapshots:
                type: object
                additionalProperties:
                  $ref: ../components/schemas/CharacterSnapshot.yaml
              participants:
                type: object
                additionalProperties:
                  $ref: ../components/schemas/SessionParticipant.yaml
    '404':
      description: Session not found
      content:
        application/json:
          schema:
            $ref: ../components/schemas/OneTrickError.yaml
    '500':
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: ../components/schemas/OneTrickError.yaml
