post:
  parameters:
    - $ref: ../components/parameters/X-User-ID.yaml
    - $ref: ../components/parameters/X-Membership-ID.yaml
  requestBody:
    description: Provide the character to take the snapshot of
    required: true
    content:
      application/json:
        schema:
          required:
            - characterId
          type: object
          properties:
            characterId:
              type: string
              x-go-name: characterID
  operationId: CreateSnapshot
  description: "Creates a new snapshot in the system and returns a list of "
  responses:
    "201":
      description: Return the created snapshot
      content:
        application/json:
          schema:
            $ref: ../components/schemas/CharacterSnapshot.yaml
get:
  operationId: GetSnapshots
  description: Returns a paginated list of snapshots in the system for a user and character, with optional metrics, sorting, and gameMode filtering
  parameters:
    - name: userId
      in: query
      x-go-name: userID
      required: true
      schema:
        type: string
    - name: characterId
      in: query
      x-go-name: characterID
      required: true
      schema:
        type: string
    - name: count
      in: query
      required: false
      schema:
        type: integer
        format: int
        minimum: 1
        maximum: 50
        default: 10
    - name: page
      in: query
      required: false
      schema:
        type: integer
        format: int
        minimum: 0
        default: 0
    - name: gameMode
      in: query
      required: false
      schema:
        $ref: ../components/schemas/GameMode.yaml
    - name: minimumGames
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 1000
    - name: includeStats
      in: query
      required: false
      schema:
        type: boolean
        default: false
    - name: sortBy
      in: query
      required: false
      schema:
        type: string
        enum:
          - created_at
          - win_rate
          - kd_ratio
          - matches_played
        x-enum-varnames:
          - SortByCreatedAt
          - SortByWinRate
          - SortByKDRatio
          - SortByMatchesPlayed
        default: created_at
  responses:
    "200":
      description: Returns loadouts response with optional metrics map and match counts
      content:
        application/json:
          schema:
            required:
              - items
            type: object
            properties:
              items:
                type: array
                items:
                  $ref: ../components/schemas/CharacterSnapshot.yaml
              stats:
                type: object
                description: Map of snapshot ID to PlayerStats (populated when includeStats is true or when sorting by metrics)
                additionalProperties:
                  $ref: ../components/schemas/PlayerStats.yaml
              count:
                type: object
                description: Map of snapshot ID to total matches played
                additionalProperties:
                  type: integer
