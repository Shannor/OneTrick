get:
  operationId: GetFeaturedLoadouts
  description: Returns featured PvP loadouts of the day for display on the home page
  parameters:
    - in: query
      name: count
      schema:
        type: integer
        minimum: 1
        maximum: 20
        default: 5
    - in: query
      name: gameMode
      schema:
        $ref: ../components/schemas/GameMode.yaml
  responses:
    "200":
      description: Returns featured loadouts of the day
      content:
        application/json:
          schema:
            type: object
            required:
              - items
            properties:
              items:
                type: array
                items:
                  $ref: ../components/schemas/FeaturedLoadout.yaml
    "400":
      description: Bad request
      content:
        application/json:
          schema:
            $ref: ../components/schemas/OneTrickError.yaml
    "401":
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: ../components/schemas/OneTrickError.yaml
    "404":
      description: Not found
      content:
        application/json:
          schema:
            $ref: ../components/schemas/OneTrickError.yaml
    "500":
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: ../components/schemas/OneTrickError.yaml
